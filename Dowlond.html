<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload & Download Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dropzone {
            border: 2px dashed #4B0082;
            transition: all 0.3s ease;
        }
        .dropzone.active {
            border-color: #7B3F00;
            background-color: rgba(75, 0, 130, 0.05);
        }
        .file-item {
            transition: all 0.2s ease;
        }
        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .progress-bar {
            height: 4px;
            background-color: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #4B0082;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="bg-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-purple-900 mb-2">Upload & Download Portal</h1>
            <p class="text-gray-600">Simple, secure file sharing with no size limits</p>
        </header>

        <!-- Upload Section -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <div 
                id="dropzone" 
                class="dropzone rounded-lg p-8 text-center cursor-pointer mb-4"
                ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)"
                ondrop="handleDrop(event)"
            >
                <div class="flex flex-col items-center justify-center space-y-4">
                    <div class="bg-purple-100 p-4 rounded-full">
                        <i class="fas fa-cloud-upload-alt text-purple-600 text-3xl"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-800">Drag & drop files here</h3>
                    <p class="text-gray-500">or</p>
                    <label for="fileInput" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-6 rounded-full cursor-pointer transition duration-300">
                        <i class="fas fa-folder-open mr-2"></i> Select Files
                    </label>
                    <input 
                        id="fileInput" 
                        type="file" 
                        class="hidden" 
                        multiple 
                        onchange="handleFileSelect(event)"
                    />
                </div>
            </div>
            
            <!-- Progress Bar (hidden by default) -->
            <div id="progressContainer" class="hidden">
                <div class="flex justify-between mb-1">
                    <span class="text-sm font-medium text-purple-900">Uploading...</span>
                    <span id="progressPercent" class="text-sm font-medium text-purple-900">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- File List Section -->
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-2xl font-semibold text-purple-900 mb-4 flex items-center">
                <i class="fas fa-file-alt mr-2"></i> Your Files
            </h2>
            
            <div id="fileList" class="space-y-3">
                <!-- Files will appear here -->
                <div id="emptyState" class="text-center py-8">
                    <i class="fas fa-folder-open text-gray-300 text-5xl mb-3"></i>
                    <p class="text-gray-500">No files uploaded yet</p>
                </div>
            </div>
        </div>

        <!-- Language Toggle -->
        <div class="mt-6 text-center">
            <button 
                id="languageToggle" 
                class="text-purple-600 hover:text-purple-800 transition duration-300"
                onclick="toggleLanguage()"
            >
                <i class="fas fa-language mr-1"></i> Türkçe / English
            </button>
        </div>
    </div>

    <script>
        // Store uploaded files in memory
        let uploadedFiles = [];
        let currentLanguage = 'en';
        
        // Language translations
        const translations = {
            en: {
                title: "Upload & Download Portal",
                subtitle: "Simple, secure file sharing with no size limits",
                dragDrop: "Drag & drop files here",
                or: "or",
                selectFiles: "Select Files",
                yourFiles: "Your Files",
                noFiles: "No files uploaded yet",
                download: "Download",
                delete: "Delete",
                uploading: "Uploading...",
                changeLanguage: "Türkçe / English"
            },
            tr: {
                title: "Yükleme & İndirme Portalı",
                subtitle: "Boyut sınırı olmadan basit, güvenli dosya paylaşımı",
                dragDrop: "Dosyaları buraya sürükleyin",
                or: "veya",
                selectFiles: "Dosya Seç",
                yourFiles: "Dosyalarınız",
                noFiles: "Henüz dosya yüklenmedi",
                download: "İndir",
                delete: "Sil",
                uploading: "Yükleniyor...",
                changeLanguage: "Türkçe / English"
            }
        };

        // Toggle between languages
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'en' ? 'tr' : 'en';
            updateLanguage();
        }

        // Update all text elements with current language
        function updateLanguage() {
            const lang = translations[currentLanguage];
            document.querySelector('h1').textContent = lang.title;
            document.querySelector('header p').textContent = lang.subtitle;
            document.querySelector('#dropzone h3').textContent = lang.dragDrop;
            document.querySelector('#dropzone p').textContent = lang.or;
            document.querySelector('#dropzone label').innerHTML = `<i class="fas fa-folder-open mr-2"></i> ${lang.selectFiles}`;
            document.querySelector('.bg-white.rounded-xl h2').innerHTML = `<i class="fas fa-file-alt mr-2"></i> ${lang.yourFiles}`;
            document.querySelector('#emptyState p').textContent = lang.noFiles;
            document.querySelector('#languageToggle').innerHTML = `<i class="fas fa-language mr-1"></i> ${lang.changeLanguage}`;
            
            // Update buttons in file list
            document.querySelectorAll('.download-btn').forEach(btn => {
                btn.innerHTML = `<i class="fas fa-download mr-1"></i> ${lang.download}`;
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.innerHTML = `<i class="fas fa-trash mr-1"></i> ${lang.delete}`;
            });
            
            if (document.getElementById('progressContainer').style.display !== 'none') {
                document.querySelector('#progressContainer span:first-child').textContent = lang.uploading;
            }
        }

        // Handle drag over event
        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropzone').classList.add('active');
        }

        // Handle drag leave event
        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropzone').classList.remove('active');
        }

        // Handle drop event
        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropzone').classList.remove('active');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                processFiles(files);
            }
        }

        // Handle file selection via input
        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                processFiles(files);
            }
            // Reset the input to allow selecting the same file again
            e.target.value = '';
        }

        // Process selected files
        function processFiles(files) {
            // Show progress bar
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressPercent = document.getElementById('progressPercent');
            
            progressContainer.classList.remove('hidden');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
            
            // Simulate upload progress (in a real app, this would be actual upload progress)
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                progressFill.style.width = `${progress}%`;
                progressPercent.textContent = `${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        progressContainer.classList.add('hidden');
                        
                        // Add files to the list
                        Array.from(files).forEach(file => {
                            uploadedFiles.push(file);
                            addFileToUI(file);
                        });
                        
                        // Hide empty state if it's the first file
                        if (uploadedFiles.length === files.length) {
                            document.getElementById('emptyState').style.display = 'none';
                        }
                    }, 500);
                }
            }, 100);
        }

        // Add a file to the UI list
        function addFileToUI(file) {
            const fileList = document.getElementById('fileList');
            const lang = translations[currentLanguage];
            
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item bg-gray-50 rounded-lg p-4 flex items-center justify-between';
            
            const fileInfo = document.createElement('div');
            fileInfo.className = 'flex items-center';
            
            const fileIcon = document.createElement('div');
            fileIcon.className = 'bg-purple-100 p-2 rounded-lg mr-3';
            
            const icon = document.createElement('i');
            icon.className = 'fas ' + getFileIcon(file.name) + ' text-purple-600';
            fileIcon.appendChild(icon);
            
            const fileName = document.createElement('div');
            fileName.className = 'flex flex-col';
            
            const name = document.createElement('span');
            name.className = 'font-medium text-gray-800';
            name.textContent = file.name;
            
            const size = document.createElement('span');
            size.className = 'text-sm text-gray-500';
            size.textContent = formatFileSize(file.size);
            
            fileName.appendChild(name);
            fileName.appendChild(size);
            
            fileInfo.appendChild(fileIcon);
            fileInfo.appendChild(fileName);
            
            const fileActions = document.createElement('div');
            fileActions.className = 'flex space-x-2';
            
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-full text-sm transition duration-300';
            downloadBtn.innerHTML = `<i class="fas fa-download mr-1"></i> ${lang.download}`;
            downloadBtn.onclick = () => downloadFile(file);
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-full text-sm transition duration-300';
            deleteBtn.innerHTML = `<i class="fas fa-trash mr-1"></i> ${lang.delete}`;
            deleteBtn.onclick = () => deleteFile(file, fileItem);
            
            fileActions.appendChild(downloadBtn);
            fileActions.appendChild(deleteBtn);
            
            fileItem.appendChild(fileInfo);
            fileItem.appendChild(fileActions);
            
            fileList.insertBefore(fileItem, fileList.firstChild);
        }

        // Download a file
        function downloadFile(file) {
            const url = URL.createObjectURL(file);
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Delete a file
        function deleteFile(file, element) {
            uploadedFiles = uploadedFiles.filter(f => f.name !== file.name || f.size !== file.size || f.lastModified !== file.lastModified);
            element.remove();
            
            // Show empty state if no files left
            if (uploadedFiles.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
            }
        }

        // Helper function to get file icon based on extension
        function getFileIcon(filename) {
            const extension = filename.split('.').pop().toLowerCase();
            
            switch(extension) {
                case 'pdf':
                    return 'fa-file-pdf';
                case 'doc':
                case 'docx':
                    return 'fa-file-word';
                case 'xls':
                case 'xlsx':
                    return 'fa-file-excel';
                case 'ppt':
                case 'pptx':
                    return 'fa-file-powerpoint';
                case 'jpg':
                case 'jpeg':
                case 'png':
                case 'gif':
                    return 'fa-file-image';
                case 'zip':
                case 'rar':
                case '7z':
                    return 'fa-file-archive';
                case 'mp3':
                case 'wav':
                case 'ogg':
                    return 'fa-file-audio';
                case 'mp4':
                case 'avi':
                case 'mov':
                    return 'fa-file-video';
                default:
                    return 'fa-file';
            }
        }

        // Helper function to format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
